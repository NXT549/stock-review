name: Build Windows app

# Builds "Stock Review Setup.exe" (installer) and a portable zip on a Windows
# runner, using the same PyInstaller spec + Inno Setup script as
# packaging/build_exe.ps1.
#
#   * push a tag like v2.3   -> build + publish a GitHub Release with both files
#   * push to any branch that touches the app/packaging -> build only (check +
#     downloadable workflow artifact, no release)
#   * "Run workflow" button   -> build only
#
# Release assets use fixed names so these links always serve the newest build:
#   https://github.com/nxt549/stock-review/releases/latest/download/Stock-Review-Setup.exe
#   https://github.com/nxt549/stock-review/releases/latest/download/Stock-Review-Portable.zip

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "src/stock_analyzer/review/**"
      - "packaging/**"
      - "stock_review.py"
      - "stock_review_gui.py"
      - "stock_review_board.py"
      - "tests/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the build to (e.g. v2.3). Replaces assets with the same name. Leave empty to build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==1.4.1" pandas requests beautifulsoup4 lxml "pyinstaller>=6.6" pyinstaller-hooks-contrib

      - name: Run the app's offline tests
        run: |
          python tests/test_stock_review.py
          python tests/test_cli.py
          python tests/test_gui.py
          python tests/test_gui_board.py

      # Opens the real main window on this Windows machine and drives it through
      # a whole offline session (every source, a run, sorting, themes, resize).
      # A window that cannot open or misbehaves must never reach a release.
      - name: Open and drive the real window
        env:
          STOCK_REVIEW_WINDOW_TEST: "1"
        run: python tests/test_gui_board_window.py

      - name: Freeze with PyInstaller
        run: python -m PyInstaller packaging/stock_review_gui.spec --noconfirm --clean

      - name: Check both exes exist
        shell: pwsh
        run: |
          foreach ($e in @("dist\Stock Review\Stock Review.exe", "dist\Stock Review\Stock Review Terminal.exe", "dist\Stock Review\Stock Review Classic.exe")) {
            if (-not (Test-Path $e)) { throw "missing: $e" }
          }

      # The frozen main exe must open its window and close by itself. A crash in
      # a windowed exe shows a dialog and never exits, hence the timeout.
      - name: Open the frozen main window
        shell: pwsh
        run: |
          $env:STOCK_REVIEW_SMOKE_MS = "4000"
          $p = Start-Process -PassThru -FilePath "dist\Stock Review\Stock Review.exe"
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Stock Review.exe did not close by itself (crashed or hung)" }
          if ($p.ExitCode -ne 0) { throw "Stock Review.exe exited with code $($p.ExitCode)" }
          Write-Host "Stock Review.exe opened and closed cleanly"

      # Fetches one ticker from Yahoo inside the frozen exe. Yahoo sometimes
      # blocks CI machines, so a failure here is a warning, not a broken build.
      - name: Smoke-test the frozen app
        continue-on-error: true
        shell: pwsh
        run: |
          $env:STOCK_REVIEW_SELFTEST = "1"
          Start-Process -Wait -FilePath "dist\Stock Review\Stock Review.exe"
          Get-ChildItem -Recurse "$env:USERPROFILE\Documents\Stock Review","dist\Stock Review" -Filter selftest_result.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_.FullName }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "packaging\installer_output\Stock Review Setup.exe" "out\Stock-Review-Setup.exe"
          Compress-Archive -Path "dist\Stock Review" -DestinationPath "out\Stock-Review-Portable.zip"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: stock-review-windows
          path: out/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Stock-Review-Setup.exe
            out/Stock-Review-Portable.zip
          body: |
            ## Download

            **[⬇ Stock-Review-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Stock-Review-Setup.exe)**: double-click it and follow the prompts.
            No admin password and no Python needed.

            If Windows says *"Windows protected your PC"*, click **More info**, then **Run anyway**. It's only shown because the app is new.

            Prefer not to install? Download **Stock-Review-Portable.zip**, extract it, and run `Stock Review.exe`.

            See [CHANGES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGES.md) for what's new.
            Not financial advice.

      - name: Upload build to an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            out/Stock-Review-Setup.exe
            out/Stock-Review-Portable.zip
