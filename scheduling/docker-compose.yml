# docker compose -f scheduling/docker-compose.yml up -d        # scheduled service
# docker compose -f scheduling/docker-compose.yml run --rm app once       # one-shot
# docker compose -f scheduling/docker-compose.yml run --rm app backtest   # backtest
#
# Build context is the repo root (..), so the image sees the whole project.
services:
  app:
    build:
      context: ..
      dockerfile: scheduling/Dockerfile
    image: stock-analyzer:latest
    environment:
      # Single combined run after both markets close -> 22:30 UTC (see README).
      TZ: "UTC"
      # Point at the bundled Postgres instead of SQLite by uncommenting:
      # STOCK_ANALYZER_DB_URL: "postgresql+psycopg2://sa:sa@db:5432/stock_analyzer"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
      - ../database:/app/database
      - ../logs:/app/logs
      - ../config:/app/config
    restart: unless-stopped
    # depends_on: [db]   # uncomment if using Postgres

  # Optional PostgreSQL (enable STOCK_ANALYZER_DB_URL above + depends_on).
  # db:
  #   image: postgres:16
  #   environment:
